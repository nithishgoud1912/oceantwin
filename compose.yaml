services:
  oceantwin:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      OCEANTWIN_DATA_DIR: /data
      OCEANTWIN_WATCH: "1"
    volumes:
      - .:/data:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
